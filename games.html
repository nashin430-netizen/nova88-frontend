<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOVA88 - Games</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #08090d;
      color: #fff;
      min-height: 100vh;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #252832;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
    }

    .logo span {
      color: #ffae2b;
    }

    .back {
      background: #ff9f1c;
      color: #111;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 40px 20px;
    }

    .title {
      margin-bottom: 30px;
    }

    .title h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .title p {
      color: #9da3b2;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .game {
      background: #11131a;
      border: 1px solid #292d38;
      border-radius: 16px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .game:hover {
      transform: translateY(-5px);
      border-color: #ffae2b;
    }

    .game-icon {
      font-size: 50px;
      margin-bottom: 15px;
    }

    .game h3 {
      color: #ffae2b;
      margin-bottom: 8px;
    }

    .game p {
      color: #a5aab8;
    }

    @media (max-width: 700px) {
      .games {
        grid-template-columns: 1fr;
      }

      .title h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <header>

    <div class="logo">
      NOVA<span>88</span>
    </div>

    <button class="back" onclick="goBack()">
      ← Dashboard
    </button>

  </header>

  <main>

    <div class="title">
      <h1>🎮 Games</h1>
      <p>Choose a game to continue.</p>
    </div>

    <div class="games"></div>

  </main>

  <script>

    const token = localStorage.getItem("nova88_token");
    const API = "https://nova88-backend.onrender.com/api";

    if (!token) {
      window.location.href = "index.html";
    }

    function goBack() {
      window.location.href = "dashboard.html";
    }

    async function loadGames() {

      const gamesContainer = document.querySelector(".games");

      try {

        const response = await fetch(`${API}/games`);

        if (!response.ok) {
          throw new Error("Failed to load games");
        }

        const games = await response.json();

        gamesContainer.innerHTML = "";

        if (games.length === 0) {

          gamesContainer.innerHTML = `
            <div class="game">
              <div class="game-icon">🎮</div>
              <h3>No Games Available</h3>
              <p>Games will be added soon.</p>
            </div>
          `;

          return;
        }

        games.forEach(game => {

          const card = document.createElement("div");
          card.className = "game";

          card.innerHTML = `
            <div class="game-icon">
              ${game.icon || "🎮"}
            </div>

            <h3>${game.name}</h3>

            <p>
              ${game.description || "Play now."}
            </p>
          `;

          card.onclick = () => openGame(game.name);

          gamesContainer.appendChild(card);

        });

      } catch (error) {

        gamesContainer.innerHTML = `
          <div class="game">
            <div class="game-icon">⚠️</div>
            <h3>Unable to load games</h3>
            <p>Please try again later.</p>
          </div>
        `;

      }
    }

    function openGame(game) {
      alert(game + " game will be available soon.");
    }

    loadGames();

  </script>

</body>
</html>
