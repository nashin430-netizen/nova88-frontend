<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOVA88 - Account</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #08090d;
      color: #fff;
      min-height: 100vh;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #252832;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
    }

    .logo span {
      color: #ffae2b;
    }

    .back {
      background: #ff9f1c;
      color: #111;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    main {
      max-width: 800px;
      margin: auto;
      padding: 40px 20px;
    }

    .title {
      margin-bottom: 30px;
    }

    .title h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .title p {
      color: #9da3b2;
    }

    .account-card {
      background: #11131a;
      border: 1px solid #292d38;
      border-radius: 16px;
      padding: 30px;
    }

    .profile-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #ff9f1c;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
      margin-bottom: 25px;
    }

    .info {
      padding: 18px 0;
      border-bottom: 1px solid #292d38;
    }

    .info:last-child {
      border-bottom: none;
    }

    .label {
      color: #8f95a3;
      font-size: 14px;
      margin-bottom: 7px;
    }

    .value {
      font-size: 17px;
      font-weight: 600;
    }

    .logout {
      margin-top: 25px;
      background: #ff9f1c;
      color: #111;
      border: none;
      padding: 13px 25px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    @media (max-width: 700px) {
      .title h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <header>

    <div class="logo">
      NOVA<span>88</span>
    </div>

    <button class="back" onclick="goBack()">
      ← Dashboard
    </button>

  </header>

  <main>

    <div class="title">
      <h1>👤 My Account</h1>
      <p>Manage and view your account information.</p>
    </div>

    <div class="account-card">

      <div class="profile-icon">
        👤
      </div>

      <div class="info">
        <div class="label">Name</div>
        <div class="value" id="userName">Loading...</div>
      </div>

      <div class="info">
        <div class="label">Email</div>
        <div class="value" id="userEmail">Loading...</div>
      </div>

      <button class="logout" onclick="logout()">
        Logout
      </button>

    </div>

  </main>

  <script>

    const token = localStorage.getItem("nova88_token");
    const API = "https://nova88-backend.onrender.com/api";

    if (!token) {
      window.location.href = "index.html";
    }

    async function loadAccount() {

      try {

        const response = await fetch(`${API}/auth/me`, {
          headers: {
            Authorization: `Bearer ${token}`
          }
        });

        const data = await response.json();

        if (!response.ok) {
          localStorage.removeItem("nova88_token");
          window.location.href = "index.html";
          return;
        }

        document.getElementById("userName").textContent =
          data.user.name;

        document.getElementById("userEmail").textContent =
          data.user.email;

      } catch (error) {

        document.getElementById("userName").textContent =
          "Unable to load";

        document.getElementById("userEmail").textContent =
          "Unable to load";
      }
    }

    function goBack() {
      window.location.href = "dashboard.html";
    }

    function logout() {
      localStorage.removeItem("nova88_token");
      window.location.href = "index.html";
    }

    loadAccount();

  </script>

</body>
</html>
