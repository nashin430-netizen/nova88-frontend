<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOVA88 - My Account</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #08090d;
      color: #fff;
      min-height: 100vh;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #252832;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
    }

    .logo span {
      color: #ffae2b;
    }

    .back {
      color: #111;
      background: #ffae2b;
      border: none;
      padding: 11px 18px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 45px 20px;
    }

    .title {
      margin-bottom: 30px;
    }

    .title h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .title p {
      color: #9da3b2;
    }

    .account-card {
      background: #11131a;
      border: 1px solid #292d38;
      border-radius: 18px;
      overflow: hidden;
    }

    .account-header {
      padding: 25px;
      border-bottom: 1px solid #292d38;
    }

    .account-header h2 {
      color: #ffae2b;
      margin-bottom: 6px;
    }

    .account-header p {
      color: #9da3b2;
    }

    .info {
      padding: 25px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 18px 0;
      border-bottom: 1px solid #242732;
    }

    .row:last-child {
      border-bottom: none;
    }

    .label {
      color: #8f95a5;
    }

    .value {
      font-weight: bold;
      text-align: right;
      word-break: break-word;
    }

    .role {
      color: #ffae2b;
    }

    .loading {
      color: #ffae2b;
    }

    .error {
      color: #ff6b6b;
    }

    @media (max-width: 600px) {

      header {
        padding: 16px;
      }

      .logo {
        font-size: 24px;
      }

      .title h1 {
        font-size: 28px;
      }

      .row {
        flex-direction: column;
        gap: 7px;
      }

      .value {
        text-align: left;
      }
    }
  </style>
</head>

<body>

  <header>

    <div class="logo">
      NOVA<span>88</span>
    </div>

    <button
      class="back"
      id="backBtn"
    >
      ← Dashboard
    </button>

  </header>


  <main>

    <div class="title">

      <h1>My Account</h1>

      <p>
        Manage and view your account information.
      </p>

    </div>


    <div class="account-card">

      <div class="account-header">

        <h2>Account Information</h2>

        <p>
          Your registered account details.
        </p>

      </div>


      <div class="info">

        <div class="row">

          <span class="label">
            Name
          </span>

          <span
            class="value loading"
            id="userName"
          >
            Loading...
          </span>

        </div>


        <div class="row">

          <span class="label">
            Email
          </span>

          <span
            class="value loading"
            id="userEmail"
          >
            Loading...
          </span>

        </div>


        <div class="row">

          <span class="label">
            Account Role
          </span>

          <span
            class="value role loading"
            id="userRole"
          >
            Loading...
          </span>

        </div>

      </div>

    </div>

  </main>


  <script>

    const API =
      "https://nova88-backend.onrender.com/api";

    const token =
      localStorage.getItem("nova88_token");


    /*
      Protect Account Page
    */

    if (!token) {

      window.location.href =
        "index.html";

    }


    /*
      Load account information
    */

    async function loadAccount() {

      try {

        const response =
          await fetch(
            `${API}/auth/me`,
            {
              method: "GET",

              headers: {
                "Authorization":
                  `Bearer ${token}`
              }
            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          localStorage.removeItem(
            "nova88_token"
          );

          window.location.href =
            "index.html";

          return;
        }


        /*
          Display user information
        */

        document.getElementById(
          "userName"
        ).textContent =
          data.user.name;


        document.getElementById(
          "userEmail"
        ).textContent =
          data.user.email;


        document.getElementById(
          "userRole"
        ).textContent =
          data.user.role || "USER";


        /*
          Remove loading style
        */

        document
          .querySelectorAll(".loading")
          .forEach(element => {
            element.classList.remove(
              "loading"
            );
          });


      } catch (error) {

        document.getElementById(
          "userName"
        ).textContent =
          "Unable to load";


        document.getElementById(
          "userEmail"
        ).textContent =
          "Unable to load";


        document.getElementById(
          "userRole"
        ).textContent =
          "Unable to load";


        document
          .querySelectorAll(".value")
          .forEach(element => {
            element.classList.add("error");
          });

      }

    }


    /*
      Back to Dashboard
    */

    document
      .getElementById("backBtn")
      .addEventListener(
        "click",
        () => {

          window.location.href =
            "dashboard.html";

        }
      );


    loadAccount();

  </script>

</body>

</html>
