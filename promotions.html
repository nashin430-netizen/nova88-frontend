<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOVA88 - Promotions</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #08090d;
      color: #fff;
      min-height: 100vh;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #252832;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
    }

    .logo span {
      color: #ffae2b;
    }

    .back {
      background: #ff9f1c;
      color: #111;

      border: none;

      padding: 12px 20px;

      border-radius: 10px;

      font-weight: bold;

      cursor: pointer;

      transition: 0.2s ease;
    }

    .back:hover {
      transform: translateY(-1px);
      opacity: 0.9;
    }

    main {
      max-width: 1100px;

      margin: auto;

      padding: 40px 20px;
    }

    .title {
      margin-bottom: 30px;
    }

    .title h1 {
      font-size: 36px;

      margin-bottom: 10px;
    }

    .title p {
      color: #9da3b2;

      line-height: 1.5;
    }

    .promotions {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 20px;
    }

    .promo {
      background: #11131a;

      border: 1px solid #292d38;

      border-radius: 16px;

      padding: 30px;

      transition: 0.25s ease;
    }

    .promo:hover {
      transform: translateY(-5px);

      border-color: #ffae2b;

      box-shadow:
        0 10px 30px
        rgba(255, 174, 43, 0.08);
    }

    .promo-icon {
      font-size: 45px;

      margin-bottom: 15px;
    }

    .promo h3 {
      color: #ffae2b;

      margin-bottom: 10px;

      font-size: 21px;
    }

    .promo p {
      color: #a5aab8;

      line-height: 1.6;
    }

    .claim {
      margin-top: 20px;

      background: #ff9f1c;

      color: #111;

      border: none;

      padding: 12px 20px;

      border-radius: 10px;

      font-weight: bold;

      cursor: pointer;

      transition: 0.2s ease;
    }

    .claim:hover {
      opacity: 0.9;

      transform: translateY(-1px);
    }

    .loading {
      text-align: center;

      padding: 50px;

      color: #ffae2b;
    }

    @media (max-width: 700px) {

      header {
        padding: 16px;
      }

      .logo {
        font-size: 24px;
      }

      .back {
        padding: 10px 14px;
      }

      main {
        padding: 30px 16px;
      }

      .title h1 {
        font-size: 28px;
      }

      .promotions {
        grid-template-columns: 1fr;
      }

      .promo {
        padding: 25px;
      }
    }
  </style>
</head>


<body>

  <header>

    <div class="logo">
      NOVA<span>88</span>
    </div>

    <button
      class="back"
      id="backBtn"
    >
      ← Dashboard
    </button>

  </header>


  <main>

    <div class="title">

      <h1>🎁 Promotions</h1>

      <p>
        Check out our latest promotions and offers.
      </p>

    </div>


    <div
      class="promotions"
      id="promotionsContainer"
    >

      <div class="loading">
        Loading promotions...
      </div>

    </div>

  </main>


  <script>

    const API =
      "https://nova88-backend.onrender.com/api";


    /*
      Get JWT token
    */

    const token =
      localStorage.getItem("nova88_token");


    /*
      Protect page
    */

    if (!token) {

      window.location.href =
        "index.html";

    }


    /*
      Dashboard button
    */

    document
      .getElementById("backBtn")
      .addEventListener(
        "click",
        () => {

          window.location.href =
            "dashboard.html";

        }
      );


    /*
      Verify logged-in user
    */

    async function verifyUser() {

      try {

        const response =
          await fetch(
            `${API}/auth/me`,
            {
              method: "GET",

              headers: {
                "Authorization":
                  `Bearer ${token}`
              }
            }
          );


        if (!response.ok) {

          localStorage.removeItem(
            "nova88_token"
          );

          window.location.href =
            "index.html";

          return false;
        }


        return true;

      } catch (error) {

        return false;

      }

    }


    /*
      Load promotions
    */

    async function loadPromotions() {

      const container =
        document.getElementById(
          "promotionsContainer"
        );


      const validUser =
        await verifyUser();


      if (!validUser) {
        return;
      }


      /*
        Demo promotions
      */

      container.innerHTML = `

        <div class="promo">

          <div class="promo-icon">
            🎁
          </div>

          <h3>
            Welcome Bonus
          </h3>

          <p>
            New members can check available
            welcome offers and promotional
            rewards.
          </p>

          <button
            class="claim"
            data-promo="Welcome Bonus"
          >
            Claim Offer
          </button>

        </div>


        <div class="promo">

          <div class="promo-icon">
            🔥
          </div>

          <h3>
            Special Offer
          </h3>

          <p>
            Limited-time promotional offer.
            Check your account for available
            details.
          </p>

          <button
            class="claim"
            data-promo="Special Offer"
          >
            View Offer
          </button>

        </div>


        <div class="promo">

          <div class="promo-icon">
            ⚡
          </div>

          <h3>
            Daily Rewards
          </h3>

          <p>
            Demo reward section for future
            promotional content.
          </p>

          <button
            class="claim"
            data-promo="Daily Rewards"
          >
            View Details
          </button>

        </div>


        <div class="promo">

          <div class="promo-icon">
            ⭐
          </div>

          <h3>
            VIP Rewards
          </h3>

          <p>
            Demo VIP promotion area for
            future account features.
          </p>

          <button
            class="claim"
            data-promo="VIP Rewards"
          >
            View Details
          </button>

        </div>

      `;


      /*
        Promotion buttons
      */

      document
        .querySelectorAll("[data-promo]")
        .forEach(button => {

          button.addEventListener(
            "click",
            () => {

              const promo =
                button.dataset.promo;

              alert(
                promo +
                " selected. Demo feature only."
              );

            }
          );

        });

    }


    /*
      Start
    */

    loadPromotions();

  </script>

</body>

</html>
