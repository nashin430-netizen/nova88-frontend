<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA88 - Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #08090d;
      color: #fff;
      min-height: 100vh;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #252832;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
    }

    .logo span {
      color: #ffae2b;
    }

    .logout {
      background: #ff9f1c;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 40px 20px;
    }

    .welcome {
      margin-bottom: 30px;
    }

    .welcome h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #9da3b2;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .card {
      background: #11131a;
      border: 1px solid #292d38;
      border-radius: 16px;
      padding: 25px;
    }

    .card h3 {
      color: #ffae2b;
      margin-bottom: 10px;
    }

    .card p {
      color: #a5aab8;
    }

    @media (max-width: 700px) {
      .cards {
        grid-template-columns: 1fr;
      }

      .welcome h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">
      NOVA<span>88</span>
    </div>

    <button class="logout" onclick="logout()">
      Logout
    </button>
  </header>

  <main>

    <div class="welcome">
  <h1>Welcome to your Dashboard</h1>
  <p id="userInfo">Loading user information...</p>
    </div>

    <div class="cards">

      <div class="card" onclick="openGames()">
  <h3>🎮 Games</h3>
  <p>Explore available games.</p>
      </div>

      <div class="card" onclick="openPromotions()">
  <h3>🎁 Promotions</h3>
  <p>View current promotions and offers.</p>
      </div>

      <div class="card">
        <h3>👤 Account</h3>
        <p>Manage your account information.</p>
      </div>

    </div>

  </main>

  <script>
  const token = localStorage.getItem("nova88_token");
  const API = "https://nova88-backend.onrender.com/api";

  if (!token) {
    window.location.href = "index.html";
  }

  async function loadUser() {
    try {
      const response = await fetch(`${API}/auth/me`, {
        headers: {
          Authorization: `Bearer ${token}`
        }
      });

      const data = await response.json();

      if (!response.ok) {
        localStorage.removeItem("nova88_token");
        window.location.href = "index.html";
        return;
      }

      document.getElementById("userInfo").textContent =
        `Welcome, ${data.user.name} • ${data.user.email}`;

    } catch (error) {
      document.getElementById("userInfo").textContent =
        "Unable to load account information.";
    }
  }

  function logout() {
    localStorage.removeItem("nova88_token");
    window.location.href = "index.html";
  }
function openGames() {
  window.location.href = "games.html";
    }
    function openPromotions() {
  window.location.href = "promotions.html";
    }
  loadUser();
</script>

</body>
</html>
