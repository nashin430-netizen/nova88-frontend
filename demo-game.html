<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOVA88 - Demo Game</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;

      background:
        radial-gradient(
          circle at top,
          #171a22 0%,
          #08090d 45%,
          #050609 100%
        );

      color: #fff;

      min-height: 100vh;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      padding: 17px 24px;

      border-bottom: 1px solid #252832;

      display: flex;

      justify-content: space-between;

      align-items: center;

      background: rgba(8, 9, 13, 0.92);

      position: sticky;

      top: 0;

      z-index: 100;

      backdrop-filter: blur(10px);
    }

    .logo {
      font-size: 28px;

      font-weight: 900;

      letter-spacing: 1px;
    }

    .logo span {
      color: #ffae2b;
    }

    .back {
      background:
        linear-gradient(
          135deg,
          #ffbd4a,
          #ff9418
        );

      color: #111;

      border: none;

      padding: 11px 18px;

      border-radius: 10px;

      font-weight: 800;

      cursor: pointer;

      transition: 0.2s ease;
    }

    .back:hover {
      transform: translateY(-2px);

      box-shadow:
        0 7px 20px
        rgba(255, 174, 43, 0.18);
    }

    /* =========================
       MAIN
    ========================= */

    main {
      max-width: 900px;

      margin: auto;

      padding: 42px 20px 60px;
    }

    .top {
      text-align: center;

      margin-bottom: 28px;
    }

    .top h1 {
      font-size: 34px;

      color: #ffae2b;

      margin-bottom: 9px;
    }

    .top p {
      color: #9da3b2;

      font-size: 14px;
    }

    /* =========================
       BALANCE
    ========================= */

    .balance {
      position: relative;

      overflow: hidden;

      background:
        linear-gradient(
          145deg,
          #181b23,
          #0e1016
        );

      border: 1px solid #292d38;

      border-radius: 18px;

      padding: 20px;

      text-align: center;

      margin-bottom: 20px;

      box-shadow:
        0 12px 35px
        rgba(0, 0, 0, 0.22);
    }

    .balance::before {
      content: "";

      position: absolute;

      width: 180px;
      height: 180px;

      top: -100px;
      left: 50%;

      transform: translateX(-50%);

      background:
        radial-gradient(
          circle,
          rgba(255, 174, 43, 0.13),
          transparent 70%
        );
    }

    .balance-title {
      position: relative;

      color: #9da3b2;

      font-size: 13px;

      margin-bottom: 7px;

      text-transform: uppercase;

      letter-spacing: 1px;
    }

    .balance-value {
      position: relative;

      color: #ffae2b;

      font-size: 34px;

      font-weight: 900;
    }

    .balance-unit {
      color: #777e8e;

      font-size: 12px;

      margin-left: 5px;
    }

    /* =========================
       GAME BOX
    ========================= */

    .game-box {
      background:
        linear-gradient(
          145deg,
          #151820,
          #0e1016
        );

      border: 1px solid #292d38;

      border-radius: 20px;

      padding: 28px;

      box-shadow:
        0 18px 45px
        rgba(0, 0, 0, 0.3);
    }

    /* =========================
       GAME SCREEN
    ========================= */

    .screen {
      background:
        radial-gradient(
          circle at center,
          #171b24,
          #08090d 72%
        );

      border: 1px solid #292d38;

      border-radius: 16px;

      padding: 35px 20px;

      text-align: center;

      margin-bottom: 27px;

      min-height: 185px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;
    }

    .screen-label {
      color: #6f7685;

      font-size: 11px;

      text-transform: uppercase;

      letter-spacing: 2px;

      margin-bottom: 8px;
    }

    .number {
      font-size: 76px;

      line-height: 1;

      font-weight: 900;

      color: #ffae2b;

      margin-bottom: 14px;

      text-shadow:
        0 0 25px
        rgba(255, 174, 43, 0.14);

      transition: 0.2s ease;
    }

    .result {
      min-height: 24px;

      color: #a5aab8;

      font-size: 14px;
    }

    .result.win {
      color: #5ee58b;

      font-weight: 800;
    }

    .result.lose {
      color: #ff6b6b;

      font-weight: 800;
    }

    /* =========================
       SELECTION
    ========================= */

    .selection-title {
      text-align: center;

      color: #9da3b2;

      font-size: 13px;

      margin-bottom: 15px;
    }

    .numbers {
      display: grid;

      grid-template-columns:
        repeat(5, 1fr);

      gap: 10px;

      margin-bottom: 22px;
    }

    .number-btn {
      background:
        linear-gradient(
          145deg,
          #1b1e27,
          #15171e
        );

      color: #fff;

      border: 1px solid #303542;

      border-radius: 11px;

      padding: 14px 5px;

      font-size: 17px;

      font-weight: 800;

      cursor: pointer;

      transition: 0.2s ease;
    }

    .number-btn:hover {
      border-color: #ffae2b;

      transform: translateY(-2px);
    }

    .number-btn.selected {
      background:
        linear-gradient(
          135deg,
          #ffbd4a,
          #ff9418
        );

      color: #111;

      border-color: #ffae2b;

      box-shadow:
        0 5px 18px
        rgba(255, 174, 43, 0.16);

      transform: translateY(-2px);
    }

    /* =========================
       PLAY BUTTON
    ========================= */

    .play {
      width: 100%;

      background:
        linear-gradient(
          135deg,
          #ffbd4a,
          #ff9418
        );

      color: #111;

      border: none;

      padding: 15px;

      border-radius: 11px;

      font-size: 16px;

      font-weight: 900;

      cursor: pointer;

      transition: 0.2s ease;

      box-shadow:
        0 7px 20px
        rgba(255, 174, 43, 0.1);
    }

    .play:hover:not(:disabled) {
      transform: translateY(-2px);

      box-shadow:
        0 10px 25px
        rgba(255, 174, 43, 0.18);
    }

    .play:disabled {
      opacity: 0.45;

      cursor: not-allowed;

      box-shadow: none;
    }

    /* =========================
       RESET
    ========================= */

    .reset {
      width: 100%;

      margin-top: 10px;

      background: transparent;

      color: #9299a8;

      border: 1px solid #303542;

      padding: 12px;

      border-radius: 11px;

      cursor: pointer;

      transition: 0.2s ease;
    }

    .reset:hover {
      color: #fff;

      border-color: #555b6b;

      background: #171a21;
    }

    /* =========================
       HISTORY
    ========================= */

    .history {
      margin-top: 25px;

      background:
        linear-gradient(
          145deg,
          #151820,
          #0e1016
        );

      border: 1px solid #292d38;

      border-radius: 18px;

      padding: 22px;
    }

    .history h2 {
      font-size: 19px;

      margin-bottom: 15px;
    }

    .history-list {
      display: flex;

      flex-direction: column;

      gap: 8px;

      max-height: 330px;

      overflow-y: auto;
    }

    .history-item {
      display: grid;

      grid-template-columns:
        1fr 2fr auto;

      gap: 10px;

      align-items: center;

      background: #191c25;

      border: 1px solid #242834;

      border-radius: 9px;

      padding: 12px;

      color: #b9bfcc;

      font-size: 13px;
    }

    .history-round {
      color: #777e8e;
    }

    .history-details {
      text-align: center;
    }

    .win {
      color: #5ee58b;

      font-weight: 800;
    }

    .lose {
      color: #ff6b6b;

      font-weight: 800;
    }

    .empty {
      color: #707687;

      text-align: center;

      padding: 15px;

      font-size: 13px;
    }

    /* =========================
       INFO
    ========================= */

    .info {
      text-align: center;

      color: #626979;

      font-size: 12px;

      margin-top: 18px;

      line-height: 1.5;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      header {
        padding: 15px 16px;
      }

      .logo {
        font-size: 23px;
      }

      .back {
        padding: 9px 13px;

        font-size: 12px;
      }

      main {
        padding: 30px 15px 45px;
      }

      .top h1 {
        font-size: 29px;
      }

      .game-box {
        padding: 19px;
      }

      .screen {
        min-height: 165px;

        padding: 28px 15px;
      }

      .number {
        font-size: 60px;
      }

      .numbers {
        gap: 8px;
      }

      .number-btn {
        padding: 12px 3px;

        font-size: 15px;
      }

      .history {
        padding: 18px;
      }

      .history-item {
        grid-template-columns:
          1fr auto;

        font-size: 12px;
      }

      .history-details {
        text-align: right;
      }

      .history-item .status {
        grid-column: 1 / -1;

        text-align: right;
      }

    }

  </style>
</head>


<body>


  <!-- =========================
       HEADER
  ========================= -->

  <header>

    <div class="logo">
      NOVA<span>88</span>
    </div>

    <button
      class="back"
      id="backBtn"
    >
      ← Games
    </button>

  </header>


  <!-- =========================
       MAIN
  ========================= -->

  <main>


    <div class="top">

      <h1>
        🎮 Demo Game
      </h1>

      <p>
        Pick a number and play a demo round.
      </p>

    </div>


    <!-- =========================
         BALANCE
    ========================= -->

    <div class="balance">

      <div class="balance-title">
        Demo Balance
      </div>

      <div
        class="balance-value"
        id="balance"
      >
        1000
        <span class="balance-unit">
          credits
        </span>
      </div>

    </div>


    <!-- =========================
         GAME
    ========================= -->

    <div class="game-box">


      <!-- GAME SCREEN -->

      <div class="screen">

        <div class="screen-label">
          Result
        </div>

        <div
          class="number"
          id="resultNumber"
        >
          ?
        </div>

        <div
          class="result"
          id="resultText"
        >
          Select a number to start.
        </div>

      </div>


      <!-- NUMBER SELECTION -->

      <div class="selection-title">
        Select a number from 1 to 10
      </div>


      <div
        class="numbers"
        id="numberButtons"
      ></div>


      <!-- PLAY -->

      <button
        class="play"
        id="playBtn"
        disabled
      >
        ▶ Play Round
      </button>


      <!-- RESET -->

      <button
        class="reset"
        id="resetBtn"
      >
        Reset Demo
      </button>


    </div>


    <!-- =========================
         HISTORY
    ========================= -->

    <div class="history">

      <h2>
        📜 Recent Rounds
      </h2>

      <div
        class="history-list"
        id="historyList"
      >

        <div class="empty">
          No rounds played yet.
        </div>

      </div>

    </div>


    <div class="info">
      Demo mode only — virtual credits with no real-money value.
    </div>


  </main>


  <script>

    /*
      ============================
      LOGIN PROTECTION
      ============================
    */

    const token =
      localStorage.getItem(
        "nova88_token"
      );


    if (!token) {

      window.location.href =
        "index.html";

    }


    /*
      ============================
      GAME VARIABLES
      ============================
    */

    let balance = 1000;

    let selectedNumber = null;

    let roundNumber = 0;

    let isPlaying = false;


    /*
      ============================
      ELEMENTS
      ============================
    */

    const balanceElement =
      document.getElementById(
        "balance"
      );

    const resultNumber =
      document.getElementById(
        "resultNumber"
      );

    const resultText =
      document.getElementById(
        "resultText"
      );

    const numberButtons =
      document.getElementById(
        "numberButtons"
      );

    const playBtn =
      document.getElementById(
        "playBtn"
      );

    const resetBtn =
      document.getElementById(
        "resetBtn"
      );

    const historyList =
      document.getElementById(
        "historyList"
      );

    const backBtn =
      document.getElementById(
        "backBtn"
      );


    /*
      ============================
      BACK BUTTON
      ============================
    */

    backBtn.addEventListener(
      "click",
      () => {

        window.location.href =
          "game.html";

      }
    );


    /*
      ============================
      CREATE NUMBER BUTTONS
      ============================
    */

    for (
      let i = 1;
      i <= 10;
      i++
    ) {

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "number-btn";

      button.type =
        "button";

      button.textContent =
        i;

      button.addEventListener(
        "click",
        () => {

          if (isPlaying) {
            return;
          }

          selectNumber(
            i,
            button
          );

        }
      );

      numberButtons.appendChild(
        button
      );

    }


    /*
      ============================
      SELECT NUMBER
      ============================
    */

    function selectNumber(
      number,
      button
    ) {

      selectedNumber =
        number;


      document
        .querySelectorAll(
          ".number-btn"
        )
        .forEach(
          btn => {

            btn.classList.remove(
              "selected"
            );

          }
        );


      button.classList.add(
        "selected"
      );


      resultNumber.textContent =
        "?";


      resultText.className =
        "result";


      resultText.textContent =
        "Number " +
        number +
        " selected.";


      playBtn.disabled =
        false;

    }


    /*
      ============================
      PLAY ROUND
      ============================
    */

    playBtn.addEventListener(
      "click",
      () => {

        if (
          selectedNumber === null ||
          isPlaying
        ) {

          return;

        }


        isPlaying =
          true;


        playBtn.disabled =
          true;


        resultText.className =
          "result";


        resultText.textContent =
          "Generating result...";


        resultNumber.textContent =
          "...";


        /*
          Small animation
        */

        let animationCount =
          0;


        const animation =
          setInterval(
            () => {

              const randomDisplay =
                Math.floor(
                  Math.random() * 10
                ) + 1;


              resultNumber.textContent =
                randomDisplay;


              animationCount++;


              if (
                animationCount >= 6
              ) {

                clearInterval(
                  animation
                );

              }

            },
            90
          );


        setTimeout(
          () => {

            const winningNumber =
              Math.floor(
                Math.random() * 10
              ) + 1;


            roundNumber++;


            resultNumber.textContent =
              winningNumber;


            let result;


            if (
              selectedNumber ===
              winningNumber
            ) {

              balance += 100;


              result =
                "🎉 You won +100 demo credits!";


              resultText.className =
                "result win";

            } else {

              balance -= 20;


              if (balance < 0) {
                balance = 0;
              }


              result =
                "❌ You lost 20 demo credits.";


              resultText.className =
                "result lose";

            }


            balanceElement.innerHTML =
              balance +
              `
                <span class="balance-unit">
                  credits
                </span>
              `;


            addHistory(
              roundNumber,
              selectedNumber,
              winningNumber,
              selectedNumber ===
                winningNumber
            );


            selectedNumber =
              null;


            document
              .querySelectorAll(
                ".number-btn"
              )
              .forEach(
                btn => {

                  btn.classList.remove(
                    "selected"
                  );

                }
              );


            resultText.textContent =
              result;


            isPlaying =
              false;


            playBtn.disabled =
              true;


          },
          750
        );

      }
    );


    /*
      ============================
      ADD HISTORY
      ============================
    */

    function addHistory(
      round,
      selected,
      winning,
      won
    ) {

      const empty =
        historyList.querySelector(
          ".empty"
        );


      if (empty) {

        empty.remove();

      }


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "history-item";


      const status =
        won
          ? "WIN"
          : "LOSE";


      const statusClass =
        won
          ? "win"
          : "lose";


      item.innerHTML = `

        <span class="history-round">
          Round ${round}
        </span>

        <span class="history-details">
          Pick: ${selected}
          &nbsp;•&nbsp;
          Result: ${winning}
        </span>

        <span
          class="status ${statusClass}"
        >
          ${status}
        </span>

      `;


      historyList.prepend(
        item
      );

    }


    /*
      ============================
      RESET DEMO
      ============================
    */

    resetBtn.addEventListener(
      "click",
      () => {

        if (isPlaying) {
          return;
        }


        balance =
          1000;


        selectedNumber =
          null;


        roundNumber =
          0;


        balanceElement.innerHTML =
          `
            1000
            <span class="balance-unit">
              credits
            </span>
          `;


        resultNumber.textContent =
          "?";


        resultText.className =
          "result";


        resultText.textContent =
          "Select a number to start.";


        playBtn.disabled =
          true;


        document
          .querySelectorAll(
            ".number-btn"
          )
          .forEach(
            btn => {

              btn.classList.remove(
                "selected"
              );

            }
          );


        historyList.innerHTML = `

          <div class="empty">
            No rounds played yet.
          </div>

        `;

      }
    );


  </script>

</body>

</html>
