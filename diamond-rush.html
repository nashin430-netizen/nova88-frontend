<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>NOVA88 - Diamond Rush</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {

      font-family: Arial, sans-serif;

      background:
        radial-gradient(
          circle at 50% 0%,
          #20263d 0%,
          #0c0e15 45%,
          #07080c 100%
        );

      color: #fff;

      min-height: 100vh;

      overflow-x: hidden;
    }


    /* =========================
       HEADER
    ========================= */

    header {

      height: 70px;

      padding: 0 22px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      background:
        rgba(7,8,12,0.94);

      border-bottom:
        1px solid
        rgba(255,255,255,0.08);

      position: sticky;

      top: 0;

      z-index: 20;

      backdrop-filter: blur(12px);
    }


    .logo {

      font-size: 23px;

      font-weight: 900;

      letter-spacing: 2px;

      color: #ffbd4a;

      text-shadow:
        0 0 15px
        rgba(255,189,74,0.18);
    }


    .back-btn {

      background:
        rgba(255,189,74,0.08);

      color: #ffbd4a;

      border:
        1px solid
        rgba(255,189,74,0.35);

      padding: 10px 16px;

      border-radius: 9px;

      font-weight: 800;

      cursor: pointer;

      transition: 0.2s ease;
    }


    .back-btn:hover {

      background:
        rgba(255,189,74,0.16);

      transform:
        translateY(-1px);
    }


    /* =========================
       CONTAINER
    ========================= */

    .container {

      width:
        min(900px, 94%);

      margin: auto;

      padding:
        32px 0 55px;
    }


    /* =========================
       GAME HEADER
    ========================= */

    .game-header {

      text-align: center;

      margin-bottom: 25px;
    }


    .diamond-icon {

      font-size: 60px;

      filter:
        drop-shadow(
          0 0 18px
          rgba(77,194,255,0.45)
        );

      animation:
        diamondFloat 2.5s
        ease-in-out infinite;
    }


    @keyframes diamondFloat {

      0%,
      100% {

        transform:
          translateY(0);
      }

      50% {

        transform:
          translateY(-7px);
      }

    }


    .game-title {

      margin-top: 8px;

      font-size: 31px;

      font-weight: 900;

      letter-spacing: 0.5px;
    }


    .game-subtitle {

      margin-top: 7px;

      color: #a5aab8;

      font-size: 14px;
    }


    .demo-badge {

      display: inline-block;

      margin-top: 12px;

      padding: 7px 14px;

      border-radius: 30px;

      background:
        rgba(255,189,74,0.10);

      border:
        1px solid
        rgba(255,189,74,0.18);

      color: #ffbd4a;

      font-size: 10px;

      font-weight: 900;

      letter-spacing: 1.5px;
    }


    /* =========================
       GAME PANEL
    ========================= */

    .game-panel {

      background:
        linear-gradient(
          145deg,
          rgba(24,27,40,0.97),
          rgba(12,14,22,0.97)
        );

      border:
        1px solid
        rgba(255,255,255,0.08);

      border-radius: 20px;

      padding: 22px;

      box-shadow:
        0 25px 70px
        rgba(0,0,0,0.45);
    }


    /* =========================
       STATS
    ========================= */

    .stats {

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 12px;

      margin-bottom: 20px;
    }


    .stat {

      background:
        rgba(7,9,14,0.8);

      border:
        1px solid
        rgba(255,255,255,0.07);

      border-radius: 13px;

      padding: 15px 10px;

      text-align: center;

      transition:
        border-color 0.2s ease,
        transform 0.2s ease;
    }


    .stat:hover {

      border-color:
        rgba(255,189,74,0.18);

      transform:
        translateY(-2px);
    }


    .stat-label {

      color: #858b9c;

      font-size: 10px;

      font-weight: 800;

      letter-spacing: 1px;

      text-transform: uppercase;

      margin-bottom: 7px;
    }


    .stat-value {

      font-size: 21px;

      font-weight: 900;

      color: #fff;

      transition:
        transform 0.2s ease;
    }


    .stat-value.bump {

      transform:
        scale(1.15);
    }


    /* =========================
       MESSAGE
    ========================= */

    .message {

      text-align: center;

      min-height: 24px;

      color: #b4b8c5;

      font-size: 14px;

      margin-bottom: 18px;

      line-height: 1.5;
    }


    /* =========================
       BOARD
    ========================= */

    .board {

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 10px;

      width:
        min(520px, 100%);

      margin:
        0 auto 23px;
    }


    .tile {

      position: relative;

      aspect-ratio: 1;

      border: none;

      border-radius: 15px;

      background:
        linear-gradient(
          145deg,
          #292f45,
          #121624
        );

      border:
        1px solid
        rgba(255,255,255,0.08);

      color: #ffbd4a;

      font-size: 28px;

      cursor: pointer;

      transition:
        transform 0.18s ease,
        background 0.18s ease,
        border-color 0.18s ease,
        box-shadow 0.18s ease;

      box-shadow:
        inset 0 1px 0
        rgba(255,255,255,0.05);
    }


    .tile:hover {

      transform:
        translateY(-3px)
        scale(1.015);

      border-color:
        rgba(255,189,74,0.45);

      box-shadow:
        0 8px 25px
        rgba(0,0,0,0.25);
    }


    .tile:active {

      transform:
        scale(0.94);
    }


    .tile.revealed {

      cursor: default;

      animation:
        tileReveal 0.3s ease;
    }


    @keyframes tileReveal {

      0% {

        transform:
          rotateY(90deg)
          scale(0.8);
      }

      100% {

        transform:
          rotateY(0)
          scale(1);
      }

    }


    .tile.diamond {

      background:
        radial-gradient(
          circle,
          #17384e,
          #101c2a
        );

      border-color:
        rgba(77,194,255,0.6);

      box-shadow:
        0 0 22px
        rgba(77,194,255,0.16);
    }


    .tile.empty {

      background:
        linear-gradient(
          145deg,
          #171a25,
          #0e1018
        );

      color: #606677;

      border-color:
        rgba(255,255,255,0.04);
    }


    /* =========================
       CONTROLS
    ========================= */

    .controls {

      display: flex;

      justify-content: center;

      gap: 12px;

      flex-wrap: wrap;
    }


    .control-btn {

      border: none;

      padding: 13px 25px;

      border-radius: 10px;

      font-size: 13px;

      font-weight: 900;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }


    .start-btn {

      background:
        linear-gradient(
          135deg,
          #ffbd4a,
          #ff9418
        );

      color: #111;

      box-shadow:
        0 8px 22px
        rgba(255,174,43,0.15);
    }


    .reset-btn {

      background:
        #242836;

      color: #fff;

      border:
        1px solid
        rgba(255,255,255,0.08);
    }


    .control-btn:hover {

      transform:
        translateY(-2px);
    }


    /* =========================
       INSTRUCTIONS
    ========================= */

    .instructions {

      margin-top: 22px;

      padding: 17px;

      background:
        rgba(7,9,14,0.65);

      border:
        1px solid
        rgba(255,255,255,0.05);

      border-radius: 12px;

      color: #858b9a;

      font-size: 12px;

      line-height: 1.8;

      text-align: center;
    }


    .instructions b {

      color: #c9cdd7;
    }


    /* =========================
       PREMIUM WIN SCREEN
    ========================= */

    .win-screen {

      display: none;

      position: relative;

      text-align: center;

      padding:
        42px 18px 38px;

      overflow: hidden;

      border-radius: 18px;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(255,189,74,0.14),
          transparent 45%
        );

      animation:
        winAppear 0.5s ease;
    }


    .win-screen::before {

      content: "";

      position: absolute;

      width: 220px;

      height: 220px;

      top: -110px;

      left: 50%;

      transform:
        translateX(-50%);

      background:
        radial-gradient(
          circle,
          rgba(255,189,74,0.16),
          transparent 70%
        );

      pointer-events: none;
    }


    @keyframes winAppear {

      from {

        opacity: 0;

        transform:
          translateY(20px)
          scale(0.94);
      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }

    }


    /* Trophy */

    .win-icon {

      position: relative;

      font-size: 72px;

      margin-bottom: 14px;

      filter:
        drop-shadow(
          0 0 20px
          rgba(255,189,74,0.45)
        );

      animation:
        trophyFloat 1.8s
        ease-in-out infinite;
    }


    @keyframes trophyFloat {

      0%,
      100% {

        transform:
          translateY(0)
          rotate(0deg);
      }

      50% {

        transform:
          translateY(-9px)
          rotate(-3deg);
      }

    }


    /* Win Title */

    .win-title {

      position: relative;

      font-size: 30px;

      font-weight: 900;

      letter-spacing: 0.3px;

      color: #ffbd4a;

      margin-bottom: 10px;

      text-shadow:
        0 0 18px
        rgba(255,189,74,0.20);
    }


    .win-text {

      position: relative;

      max-width: 430px;

      margin:
        0 auto 24px;

      color: #a9adba;

      font-size: 14px;

      line-height: 1.7;
    }


    /* =========================
       WIN STATS
    ========================= */

    .win-stats {

      position: relative;

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 9px;

      max-width: 480px;

      margin:
        0 auto 20px;
    }


    .win-stat {

      padding:
        13px 7px;

      border-radius: 12px;

      background:
        rgba(7,9,14,0.62);

      border:
        1px solid
        rgba(255,255,255,0.07);
    }


    .win-stat-label {

      display: block;

      color: #858b9a;

      font-size: 9px;

      font-weight: 900;

      letter-spacing: 1px;

      text-transform: uppercase;

      margin-bottom: 6px;
    }


    .win-stat-value {

      display: block;

      color: #fff;

      font-size: 20px;

      font-weight: 900;
    }


    /* =========================
       FINAL SCORE
    ========================= */

    .win-score {

      position: relative;

      display: inline-block;

      min-width: 190px;

      padding:
        17px 28px;

      margin-bottom: 25px;

      border-radius: 15px;

      background:
        linear-gradient(
          145deg,
          rgba(255,189,74,0.13),
          rgba(255,148,24,0.04)
        );

      border:
        1px solid
        rgba(255,189,74,0.28);

      box-shadow:
        0 10px 35px
        rgba(0,0,0,0.25),

        inset 0 1px 0
        rgba(255,255,255,0.05);
    }


    .win-score span {

      display: block;

      color: #858b9a;

      font-size: 10px;

      font-weight: 900;

      letter-spacing: 1.5px;

      text-transform: uppercase;

      margin-bottom: 6px;
    }


    .win-score strong {

      display: block;

      font-size: 34px;

      font-weight: 900;

      color: #fff;

      text-shadow:
        0 0 15px
        rgba(255,255,255,0.12);
    }


    /* =========================
       NEW RECORD
    ========================= */

    .new-record {

      display: none;

      position: relative;

      width: fit-content;

      margin:
        -10px auto 20px;

      padding:
        7px 14px;

      border-radius: 30px;

      background:
        rgba(255,189,74,0.10);

      border:
        1px solid
        rgba(255,189,74,0.28);

      color: #ffbd4a;

      font-size: 10px;

      font-weight: 900;

      letter-spacing: 1px;

      animation:
        recordPulse 1.2s
        ease-in-out infinite;
    }


    @keyframes recordPulse {

      0%,
      100% {

        box-shadow:
          0 0 0
          rgba(255,189,74,0);
      }

      50% {

        box-shadow:
          0 0 18px
          rgba(255,189,74,0.18);
      }

    }


    /* =========================
       WIN ACTIONS
    ========================= */

    .win-actions {

      position: relative;

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 10px;

      flex-wrap: wrap;
    }


    .play-again {

      background:
        linear-gradient(
          135deg,
          #ffbd4a,
          #ff9418
        );

      color: #111;

      border: none;

      padding:
        14px 27px;

      border-radius: 11px;

      font-weight: 900;

      cursor: pointer;

      font-size: 13px;

      box-shadow:
        0 8px 25px
        rgba(255,174,43,0.18);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }


    .play-again:hover {

      transform:
        translateY(-2px);

      box-shadow:
        0 12px 30px
        rgba(255,174,43,0.28);
    }


    .win-home {

      background:
        rgba(255,255,255,0.04);

      color: #c9cdd7;

      border:
        1px solid
        rgba(255,255,255,0.10);

      padding:
        13px 23px;

      border-radius: 11px;

      font-weight: 800;

      cursor: pointer;

      font-size: 13px;

      transition:
        0.2s ease;
    }


    .win-home:hover {

      background:
        rgba(255,255,255,0.08);

      transform:
        translateY(-2px);
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      header {

        padding:
          0 14px;
      }


      .logo {

        font-size: 19px;
      }


      .container {

        padding-top: 25px;
      }


      .game-title {

        font-size: 27px;
      }


      .game-panel {

        padding: 15px;
      }


      .stats {

        grid-template-columns:
          repeat(2, 1fr);

        gap: 7px;
      }


      .stat {

        padding:
          12px 5px;
      }


      .stat-value {

        font-size: 18px;
      }


      .board {

        gap: 7px;
      }


      .tile {

        font-size: 23px;

        border-radius: 12px;
      }


      .win-screen {

        padding:
          35px 12px 30px;
      }


      .win-icon {

        font-size: 62px;
      }


      .win-title {

        font-size: 25px;
      }


      .win-text {

        font-size: 13px;
      }


      .win-stats {

        gap: 6px;
      }


      .win-stat {

        padding:
          11px 4px;
      }


      .win-stat-value {

        font-size: 17px;
      }


      .win-score {

        min-width: 170px;
      }


      .win-score strong {

        font-size: 30px;
      }


      .win-actions {

        flex-direction: column;

        width: 100%;
      }


      .play-again,
      .win-home {

        width: min(260px, 100%);
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       HEADER
  ========================= -->

  <header>

    <div class="logo">
      NOVA88
    </div>

    <button
      class="back-btn"
      onclick="window.location.href='games.html'"
    >
      ← Games
    </button>

  </header>


  <main class="container">


    <!-- =========================
         GAME HEADER
    ========================= -->

    <div class="game-header">

      <div class="diamond-icon">
        💎
      </div>

      <div class="game-title">
        Diamond Rush
      </div>

      <div class="game-subtitle">
        Find the hidden diamonds
      </div>

      <div class="demo-badge">
        DEMO MODE
      </div>

    </div>


    <section class="game-panel">


      <!-- =========================
           GAME AREA
      ========================= -->

      <div id="gameArea">


        <div class="stats">


          <div class="stat">

            <div class="stat-label">
              Score
            </div>

            <div
              class="stat-value"
              id="score"
            >
              0
            </div>

          </div>


          <div class="stat">

            <div class="stat-label">
              Best Score
            </div>

            <div
              class="stat-value"
              id="bestScore"
            >
              0
            </div>

          </div>


          <div class="stat">

            <div class="stat-label">
              Diamonds
            </div>

            <div
              class="stat-value"
              id="diamonds"
            >
              0 / 5
            </div>

          </div>


          <div class="stat">

            <div class="stat-label">
              Moves
            </div>

            <div
              class="stat-value"
              id="moves"
            >
              0
            </div>

          </div>


        </div>


        <div
          class="message"
          id="message"
        >
          Press START GAME to begin.
        </div>


        <div
          class="board"
          id="board"
        >
        </div>


        <div class="controls">

          <button
            class="control-btn start-btn"
            onclick="startGame()"
          >
            START GAME
          </button>


          <button
            class="control-btn reset-btn"
            onclick="resetGame()"
          >
            RESET
          </button>

        </div>


      </div>


      <!-- =========================
           PREMIUM WIN SCREEN
      ========================= -->

      <div
        class="win-screen"
        id="winScreen"
      >


        <div class="win-icon">
          🏆
        </div>


        <div class="win-title">
          Diamond Rush Complete!
        </div>


        <div class="win-text">
          Congratulations! You found all
          5 hidden diamonds and completed
          the demo challenge.
        </div>


        <div class="win-stats">


          <div class="win-stat">

            <span class="win-stat-label">
              Diamonds
            </span>

            <strong
              class="win-stat-value"
              id="finalDiamonds"
            >
              5 / 5
            </strong>

          </div>


          <div class="win-stat">

            <span class="win-stat-label">
              Moves
            </span>

            <strong
              class="win-stat-value"
              id="finalMoves"
            >
              0
            </strong>

          </div>


          <div class="win-stat">

            <span class="win-stat-label">
              Best
            </span>

            <strong
              class="win-stat-value"
              id="finalBest"
            >
              0
            </strong>

          </div>


        </div>


        <div class="win-score">

          <span>
            Final Score
          </span>

          <strong
            id="finalScore"
          >
            0
          </strong>

        </div>


        <div
          class="new-record"
          id="newRecord"
        >
          🥇 NEW BEST SCORE!
        </div>


        <div class="win-actions">


          <button
            class="play-again"
            onclick="startGame()"
          >
            🔄 PLAY AGAIN
          </button>


          <button
            class="win-home"
            onclick="window.location.href='games.html'"
          >
            ← BACK TO GA
