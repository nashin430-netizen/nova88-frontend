<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOVA88 - Admin Panel</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #08090d;
      color: #fff;
      min-height: 100vh;
    }

    header {
      height: 75px;
      padding: 0 25px;
      border-bottom: 1px solid #252832;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0b0d12;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
    }

    .logo span {
      color: #ffae2b;
    }

    .admin-badge {
      color: #ffae2b;
      font-size: 13px;
      font-weight: bold;
      margin-top: 4px;
    }

    .logout {
      background: #ff9f1c;
      color: #111;
      border: none;
      padding: 11px 18px;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 35px 20px;
    }

    .page-title {
      margin-bottom: 30px;
    }

    .page-title h1 {
      font-size: 36px;
      margin-bottom: 8px;
    }

    .page-title p {
      color: #9da3b2;
    }

    .status {
      background: #11131a;
      border: 1px solid #292d38;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 25px;
    }

    .status-title {
      color: #ffae2b;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .status-text {
      color: #a5aab8;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .card {
      background: #11131a;
      border: 1px solid #292d38;
      border-radius: 16px;
      padding: 25px;
      transition: 0.25s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #ffae2b;
      box-shadow: 0 12px 30px rgba(255, 174, 43, 0.08);
    }

    .card-icon {
      font-size: 38px;
      margin-bottom: 15px;
    }

    .card h2 {
      color: #ffae2b;
      margin-bottom: 8px;
    }

    .card p {
      color: #9da3b2;
      line-height: 1.5;
    }

    .card-value {
      font-size: 32px;
      font-weight: 800;
      margin-top: 15px;
    }

    .error {
      color: #ff6b6b;
    }

    @media (max-width: 800px) {
      .cards {
        grid-template-columns: 1fr;
      }

      .page-title h1 {
        font-size: 28px;
      }

      header {
        padding: 0 15px;
      }

      .logo {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <header>

    <div>
      <div class="logo">
        NOVA<span>88</span>
      </div>

      <div class="admin-badge">
        ADMIN PANEL
      </div>
    </div>

    <button class="logout" onclick="logout()">
      Logout
    </button>

  </header>


  <main>

    <div class="page-title">
      <h1>Admin Dashboard</h1>
      <p>Manage your NOVA88 demo platform.</p>
    </div>


    <div class="status">

      <div class="status-title">
        System Status
      </div>

      <div class="status-text" id="statusText">
        Connecting to backend...
      </div>

    </div>


    <div class="cards">

      <div class="card">

        <div class="card-icon">
          👥
        </div>

        <h2>Users</h2>

        <p>
          Manage registered demo users.
        </p>

        <div class="card-value" id="userCount">
          —
        </div>

      </div>


      <div class="card">

        <div class="card-icon">
          🎮
        </div>

        <h2>Games</h2>

        <p>
          View and manage available demo games.
        </p>

        <div class="card-value" id="gameCount">
          —
        </div>

      </div>


      <div class="card">

        <div class="card-icon">
          🎁
        </div>

        <h2>Promotions</h2>

        <p>
          Manage demo promotional content.
        </p>

        <div class="card-value" id="promoCount">
          —
        </div>

      </div>

    </div>

  </main>


  <script>

    const API =
      "https://nova88-backend.onrender.com/api";

    const token =
      localStorage.getItem("nova88_token");


    // No login token
    if (!token) {
      window.location.href = "index.html";
    }


    async function loadAdminDashboard() {

      try {

        const response = await fetch(
          `${API}/admin/dashboard`,
          {
            headers: {
              Authorization: `Bearer ${token}`
            }
          }
        );


        const data = await response.json();


        if (!response.ok) {

          if (
            response.status === 401 ||
            response.status === 403
          ) {
            alert(
              "Admin access required."
            );

            window.location.href =
              "dashboard.html";

            return;
          }

          throw new Error(
            data.error ||
            "Failed to load admin dashboard."
          );
        }


        document.getElementById(
          "statusText"
        ).textContent =
          "Backend connected successfully.";


        // Show dashboard data
        if (data.users !== undefined) {
          document.getElementById(
            "userCount"
          ).textContent = data.users;
        }

        if (data.games !== undefined) {
          document.getElementById(
            "gameCount"
          ).textContent = data.games;
        }

        if (data.promotions !== undefined) {
          document.getElementById(
            "promoCount"
          ).textContent = data.promotions;
        }


      } catch (error) {

        document.getElementById(
          "statusText"
        ).innerHTML =
          `<span class="error">
            ${error.message}
          </span>`;

      }

    }


    function logout() {

      localStorage.removeItem(
        "nova88_token"
      );

      window.location.href =
        "index.html";

    }


    loadAdminDashboard();

  </script>

</body>
</html>
